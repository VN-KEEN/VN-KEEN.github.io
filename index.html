<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efe7d6">
  <title>VN-KEEN</title>
  <meta name="description" content="Trang cá nhân của VN-KEEN.">
  <link rel="icon" href="avatar.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #efe7d6;
      --ink: #1c1916;
      --muted: #5c534a;
      --rule: #d4c8b0;
      --accent: #9a3412;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
    }
    .page {
      min-height: 100vh;
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 28px 32px;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 14px;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 56px;
      align-items: center;
      padding: 72px 0;
    }
    .avatar {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
      background: #ddd4c2;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 600;
      font-size: clamp(48px, 8vw, 84px);
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    .rule {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 22px 0 20px;
    }
    p.lead {
      font-size: 18px;
      color: var(--muted);
      max-width: 34ch;
    }
    a.gh {
      display: inline-block;
      margin-top: 28px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1.5px solid var(--ink);
      padding-bottom: 2px;
    }
    a.gh:hover { color: var(--accent); border-color: var(--accent); }
    footer {
      border-top: 1px solid var(--rule);
      padding-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    @media (max-width: 700px) {
      .page { padding: 28px 20px 24px; }
      main {
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 40px 0;
      }
      .avatar { width: 120px; height: 120px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span>VN-KEEN</span>
      <span>Trang cá nhân</span>
    </header>
    <main>
      <img class="avatar" src="avatar.jpg" alt="Ảnh đại diện VN-KEEN" width="200" height="200">
      <div>
        <h1>VN-KEEN</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="lead">Đây là trang cá nhân của mình. Hiện đang xây mọi thứ trên GitHub.</p>
        <a class="gh" href="https://github.com/VN-KEEN">GitHub</a>
      </div>
    </main>
    <footer>© 2026 VN-KEEN</footer>
  </div>
</body>
</html>
