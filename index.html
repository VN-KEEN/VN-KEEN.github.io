<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán VietQR - VN-KEEN</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0d1117; color: #fff; padding: 20px; text-align: center; }
        .card { background: #161b22; max-width: 400px; margin: 0 auto; padding: 25px; border-radius: 12px; border: 1px solid #30363d; }
        input { width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; }
        button { background: #238636; color: white; border: none; padding: 12px 20px; width: 95%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background: #2ea043; }
        #qr-result { margin-top: 20px; display: none; }
        #qr-image { width: 100%; max-width: 280px; border-radius: 8px; border: 2px solid #30363d; }
    </style>
</head>
<body>

    <div class="card">
        <h2>TẠO MÃ THANH TOÁN</h2>
        
        <label>Nhập số tiền (VNĐ):</label>
        <input type="number" id="amount" placeholder="VD: 150000" value="100000">

        <label>Nội dung chuyển khoản:</label>
        <input type="text" id="addInfo" placeholder="VD: Mua hang VNKEEN" value="chuyen tien nhanh">

        <button onclick="generateQR()">TẠO MÃ QR THANH TOÁN</button>

        <div id="qr-result">
            <h3>Quét mã để thanh toán:</h3>
            <img id="qr-image" src="" alt="Mã QR VietQR">
        </div>
    </div>

    <script>
        // Cấu hình thông tin ngân hàng của bạn
        const BANK_ID = "MB"; // Mã ngân hàng (VD: MB, VCB, TCB, ACB, VPB...)
        const ACCOUNT_NO = "789789999888"; // Số tài khoản ngân hàng của bạn
        const ACCOUNT_NAME = "NGUYEN PHU QUY"; // Tên chủ tài khoản (viết hoa không dấu)

        function generateQR() {
            const amount = document.getElementById('amount').value;
            const addInfo = encodeURIComponent(document.getElementById('addInfo').value);

            if (!amount || amount <= 0) {
                alert("Vui lòng nhập số tiền hợp lệ!");
                return;
            }

            // Gọi API VietQR tạo ảnh QR tự động
            const qrUrl = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${amount}&addInfo=${addInfo}&accountName=${encodeURIComponent(ACCOUNT_NAME)}`;

            document.getElementById('qr-image').src = qrUrl;
                document.getElementById('qr-result').style.display = 'block';
        }
    </script>

</body>
</html>
